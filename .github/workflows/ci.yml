name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 to match the build stage of the Dockerfile.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: ./node_modules/.bin/eslint .

      # Plain `node --test`; the suite has no external runner and needs no browser.
      - name: Test
        run: node --test src/

      # CI uses the installed Vite binary because npm build scripts require Doppler.
      - name: Build
        run: ./node_modules/.bin/vite build
